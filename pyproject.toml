[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pertreadout"
version = "0.1.0"
description = "Reproducing GEARS on three public CRISPR perturbation datasets, and measuring how much of the reported improvement is the choice of readout."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jack Fenn" }]
keywords = ["perturbation", "CRISPR", "GEARS", "graph neural network", "evaluation"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# The full pipeline. GEARS is MIT-licensed and depended on, never forked --
# see patches/ for the one behavioural change this repo makes to it.
# cell-gears 0.1.2 is the pinned upstream GEARS. Two of the pins below exist
# because it predates changes in its own dependencies; neither changes any GEARS
# behaviour, and both are documented in patches/README.md.
full = [
    "torch>=2.4",
    "torch_geometric>=2.5",
    "cell-gears==0.1.2",
    "anndata>=0.10",
    "scanpy>=1.10",
    "pandas<3",       # GEARS uses positional Series[0], removed in pandas 3
    "scipy<1.15",     # GEARS indexes a sparse matrix with a boolean pandas Series
]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "jupyter>=1.0"]

[project.scripts]
pertreadout = "pertreadout.cli:main"

[project.urls]
Repository = "https://github.com/jackfenn/perturbation-readouts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: requires the downloaded datasets or a trained model"]
