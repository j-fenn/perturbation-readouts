name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    # This job exists to fail. The reference material for this project shipped a
    # third party's home directory, 46 MB of PNG and CPU smoke-test checkpoints;
    # none of that is a mistake anyone makes on purpose, and none of it is
    # something review reliably catches. So it is checked mechanically.
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No data files or model weights may be tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(h5ad|pt|pth|ckpt|pkl|npz|tar\.gz|zip)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::tracked data or model weights:"
            echo "$bad"
            exit 1
          fi

      - name: No tracked file may exceed 10 MB
        run: |
          set -euo pipefail
          big=$(git ls-files | while IFS= read -r f; do
                  [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 10485760 ] && echo "$f"
                done || true)
          if [ -n "$big" ]; then
            echo "::error::files over 10 MB:"
            echo "$big"
            exit 1
          fi

      - name: No absolute paths from anyone's machine
        run: |
          set -euo pipefail
          hits=$(git ls-files -z | xargs -0 grep -In -E \
                   'C:[\\/]+Users|/Users/[A-Za-z0-9._-]+/(Desktop|Documents|Downloads)|/home/[A-Za-z0-9._-]+/' \
                   || true)
          if [ -n "$hits" ]; then
            echo "::error::absolute local paths:"
            echo "$hits"
            exit 1
          fi

      - name: Notebooks must be committed without outputs
        run: python .github/check_notebooks.py

  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # torch and torch_geometric are needed for the model-shape tests. The
          # 3.5 GB of public data is not: those tests are marked `slow` and the
          # rest run against synthetic fixtures.
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
      - name: pytest
        run: pytest -q -m "not slow"
